name: Release

# run from the actions tab with a version, or push a v* tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, for example 1.0.0
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Stamp the version
        shell: bash
        run: sed -i 's/public const string Version = ".*";/public const string Version = "${{ steps.v.outputs.version }}";/' src/Program.cs
      - name: Compile
        shell: cmd
        run: call build.bat nostart
      - name: Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item Fleet.exe dist\Fleet.exe
          $h = (Get-FileHash dist\Fleet.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Fleet.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
      - name: Release notes
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "see the changelog" > notes.md; fi
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Fleet ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/Fleet.exe
            dist/SHA256SUMS.txt
      - name: Tell discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          BODY=$(python3 -c "import json,sys;print(json.dumps({'content':'**Fleet '+sys.argv[1]+'** is out: https://github.com/${{ github.repository }}/releases/tag/v'+sys.argv[1]+'\n'+open('notes.md').read()[:1500]}))" "$V")
          curl -s -H "Content-Type: application/json" -d "$BODY" "$DISCORD_WEBHOOK"
